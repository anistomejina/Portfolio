<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Anisto Mejin, DevSecOps Engineer and Security Researcher focused on offensive security." />
    <title>Anisto Mejin | Portfolio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <script>
      // Apply the saved theme before the first paint to avoid a light flash (default: light).
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('portfolio-theme')
        } catch (error) {}
        theme = theme === 'dark' ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
